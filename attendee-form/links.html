<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>BES Registration Links</title><link rel="stylesheet" href="./styles.css"><style>.links{display:grid;gap:16px;padding:28px}.link-row{padding:18px;border:1px solid #d9d4c9;border-radius:12px;overflow-wrap:anywhere}.link-row h2{font-size:19px;margin:0 0 8px}.link-row a{color:#075fba;display:block;padding:8px 0}.link-row button{padding:10px 16px;border:0;border-radius:8px;background:#087bd1;color:white;font:inherit;cursor:pointer}.notice{padding:24px;margin:0}.copy-status{min-height:24px;margin:0;padding:0 28px 20px}</style></head>
<body><main class="bes-page"><div class="bes-shell"><header class="bes-header"><img class="bes-logo" src="/IDENTITY/BEAUTY_EXPERT_SUMMIT26.png" alt="Beauty Expert Summit 2026"><h1>Permanent registration links</h1><p>For the organising team</p></header><section class="bes-card"><p class="notice">Copy the relevant link and send it manually. These forms collect details and notify the team only. They do not check payment, approve admission, send a ticket or send an attendee email. Previously sent personal links are unchanged.</p><div id="links" class="links"></div><p id="copy-status" class="copy-status" role="status" aria-live="polite"></p></section></div></main>
<script>
fetch('./catalog.json').then(r=>r.json()).then(catalog=>{for(const [key,entry] of Object.entries(catalog)){const row=document.createElement('div');row.className='link-row';const title=document.createElement('h2');title.textContent=entry.ticket_label;const a=document.createElement('a');a.href=new URL('./?option='+encodeURIComponent(key),location.href).href;a.textContent=a.href;const b=document.createElement('button');b.type='button';b.textContent='Copy link';b.setAttribute('aria-label','Copy link for '+entry.ticket_label);b.onclick=async()=>{try{await navigator.clipboard.writeText(a.href);document.getElementById('copy-status').textContent='Copied: '+entry.ticket_label;}catch{document.getElementById('copy-status').textContent='Please select and copy the link above.'}};row.append(title,a,b);document.getElementById('links').append(row);}}).catch(()=>{document.getElementById('copy-status').textContent='Could not load links. Please refresh.'});
</script></body></html>
